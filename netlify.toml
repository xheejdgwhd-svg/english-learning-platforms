[build]
  base    = "apps/web"
  publish = ".next"
  command = """
  echo '--- versions ---' \
  && node -v \
  && npm -v \
  && npx prisma -v \
  && echo '--- npm install ---' \
  && npm install --no-audit --no-fund \
  && echo '--- prisma generate ---' \
  && npx prisma generate \
  && echo '--- next build ---' \
  && npm run build
  """

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
